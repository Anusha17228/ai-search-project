<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaMind | Semantic Movie Search</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cinema<span>Mind</span></h1>
            <p class="subtitle">Search for movies by mood, theme, or description</p>
            
            <div id="statusIndicator" class="status-bar">
                <div class="status-dot"></div>
                <span id="statusText">Checking system status...</span>
            </div>
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="e.g., 'a mind-bending space adventure'..." autocomplete="off">
                <button id="searchButton">Search</button>
            </div>
            
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Analyzing semantic space...</p>
            </div>
        </header>

        <main id="resultsGrid" class="results-grid">
            <div class="welcome-msg">
                <p>Your search results will appear here. Try describing a plot!</p>
            </div>
        </main>

        <footer>
            <p>Powered by <strong>Endee</strong> Vector Database & Sentence Transformers</p>
        </footer>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsGrid = document.getElementById('resultsGrid');
        const loading = document.getElementById('loading');

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            console.log('Starting search for:', query);
            loading.classList.remove('hidden');
            resultsGrid.innerHTML = '';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, limit: 6 })
                });

                if (!response.ok) throw new Error(`Server responded with ${response.status}`);

                const results = await response.json();
                console.log('Search results received:', results);
                displayResults(results);
            } catch (error) {
                console.error('Search failed:', error);
                resultsGrid.innerHTML = `<p class="error">Search failed: Result not found. Ensure Index is Created.</p>`;
            } finally {
                loading.classList.add('hidden');
            }
        }

        function displayResults(results) {
            if (!results || results.length === 0) {
                resultsGrid.innerHTML = `<p class="no-results">No matches found. Try a different query!</p>`;
                return;
            }

            resultsGrid.innerHTML = results.map(res => {
                const p = res.payload;
                const score = (res.score * 100).toFixed(1);
                return `
                    <div class="movie-card">
                        <div class="score-badge">${score}% Match</div>
                        <div class="card-content">
                            <span class="genre">${p.genre}</span>
                            <h3>${p.title} <span>(${p.year})</span></h3>
                            <p>${p.overview}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        searchButton.onclick = performSearch;
        searchInput.onkeypress = (e) => { if (e.key === 'Enter') performSearch(); };

        async function checkHealth() {
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: 'healthcheck_probe', limit: 1 })
                });
                if (response.ok) {
                    statusIndicator.classList.add('online');
                    statusText.innerText = 'Systems Online';
                } else { throw new Error(); }
            } catch (p) {
                statusIndicator.classList.add('offline');
                statusText.innerText = 'Systems Offline - Check Terminal';
            }
        }
        window.onload = checkHealth;
    </script>
</body>
</html>
